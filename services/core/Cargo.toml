[package]
name = "docufill-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pdfium-render = "0.9.4"
pgvector = { version = "0.4.2", features = ["sqlx"] }
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "derive", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "request-id", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
