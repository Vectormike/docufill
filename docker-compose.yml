name: docufill

x-core-environment: &core-environment
  WEB_ORIGIN: ${PUBLIC_APP_URL:-http://localhost}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
  PDFIUM_LIB_PATH: /opt/pdfium/lib
  UNICODE_FONT_PATH: /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
  LD_LIBRARY_PATH: /opt/pdfium/lib

services:
  migrate:
    image: postgres:16-bookworm
    env_file: .env
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]
    restart: "no"
    profiles: ["migrate"]

  api:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    image: docufill-core:local
    command: ["api"]
    env_file: .env
    environment:
      <<: *core-environment
      API_BIND: 0.0.0.0:8080
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    image: docufill-core:local
    command: ["worker"]
    env_file: .env
    environment:
      <<: *core-environment
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: docufill-web:local
    env_file: .env
    environment:
      ORIGIN: ${PUBLIC_APP_URL:-http://localhost}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost}
      HOST: 0.0.0.0
      PORT: "3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  proxy:
    image: caddy:2.10-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
