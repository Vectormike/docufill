name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - uses: rustsec/audit-check@v2.0.0
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm --filter @docufill/web check
      - run: pnpm --filter @docufill/web lint
      - run: pnpm --filter @docufill/web test:unit --run
      - run: pnpm audit --audit-level high
      - run: pnpm --filter @docufill/web build
      - run: pnpm --filter @docufill/web exec playwright install --with-deps chromium
      - run: pnpm --filter @docufill/web test:e2e

